name: Research contracts

on:
  push:
    paths:
      - "src/contracts/**"
      - "src/datasets/manifest.py"
      - "src/datasets/manifest_cli.py"
      - "src/evaluation/**"
      - "src/experiments/**"
      - "src/common/reproducibility.py"
      - "schemas/**"
      - "tests/research/**"
      - ".github/workflows/research-contracts.yml"
  pull_request:
    paths:
      - "src/contracts/**"
      - "src/datasets/manifest.py"
      - "src/datasets/manifest_cli.py"
      - "src/evaluation/**"
      - "src/experiments/**"
      - "src/common/reproducibility.py"
      - "schemas/**"
      - "tests/research/**"
      - ".github/workflows/research-contracts.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Run dependency-free research contract tests
        run: python -m unittest discover -s tests/research -v
